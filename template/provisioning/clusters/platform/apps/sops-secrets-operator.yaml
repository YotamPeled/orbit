# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.

# Decrypts SopsSecret custom resources into real Secrets using the age key seeded at
# bootstrap. This is what lets encrypted secrets live in git and still reach the cluster
# through Argo, with no plaintext anywhere outside the operator's memory.
# Wave -1: everything else may depend on a secret it produces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://isindir.github.io/sops-secrets-operator/
    chart: sops-secrets-operator
    targetRevision: 0.24.1
    helm:
      values: |
        secretsAsFiles:
          - name: sops-age
            mountPath: /etc/sops-age
            secretName: sops-age
        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age/age.agekey
        resources:
          # Measured 48h: peak 29Mi, p99 28Mi — 128Mi reserved 4.5x the peak. Limit
          # unchanged at 128Mi.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: sops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
