# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.
# ClusterIssuers, the wildcard certificate, and the encrypted secrets they need.
# Wave 2: cert-manager's CRDs (wave 0) and the sops operator (wave -1) must both exist
# before any of this can apply — the SopsSecrets in this directory are the first
# things in the platform that need the operator to decrypt them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{git.repoUrl}}
    targetRevision: main
    path: clusters/platform/config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
