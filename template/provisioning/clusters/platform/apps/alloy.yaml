# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.
# Alloy is the log collector (Promtail is EOL 2026-03-02). API-based pod-log source:
# no privileged host-path mounts, no file-position spin on crashlooping pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.0
    helm:
      valuesObject:
        # Alloy itself is already right-sized: 48h peak 209Mi against a 256Mi request is
        # 1.22x. Only the chart-default config-reloader sidecar (50Mi request, 9Mi peak)
        # comes down.
        configReloader:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        alloy:
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 384Mi}
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                // service_name IS the join key across all three signals
                // (OBSERVABILITY.md Decision 5): a log line's identity must equal the
                // trace's service.name, which the generator sets to <project>-<component>
                // via OTEL_SERVICE_NAME. The old rule sourced name+app with separator=""
                // — an empty separator is not a coalesce, it CONCATENATES when both exist
                // (cainjectorcainjector, cert-managercert-manager) and, on generated app
                // pods that carry only app.kubernetes.io/name, emitted the bare component
                // (api, web) which collides the instant a second project has an `api` and
                // never matches the <project>-api the trace carries. Build it the way _helpers.tpl
                // builds identity: part-of (project) + "-" + name (component).
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  separator     = "-"
                  target_label  = "service_name"
                }
                // Fallback for pods without part-of (CNPG databases label only
                // app.kubernetes.io/name=postgresql, which collided across every project).
                // When part-of is empty the rule above yields a leading "-"; re-derive from
                // namespace + name so each stays unique (<project>-prod-postgresql). Fires only
                // on the leading-dash case — a present part-of leaves service_name untouched.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of", "__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  separator     = "-"
                  regex         = "-(.+)"
                  replacement   = "$1"
                  target_label  = "service_name"
                }
                // The catalog's own names on every tenant log line (docs/V1.md §6.1):
                // project, env and component, from the labels the service chart stamps.
                // Gated on orbit.local/env, which only tenant pods carry: a platform pod's
                // app.kubernetes.io/instance is a Helm release, not a project. One value per
                // pod, so the stream count does not grow.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_orbit_local_env", "__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
                  separator     = ";"
                  regex         = "(.+);(.+)"
                  replacement   = "$2"
                  target_label  = "project"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_orbit_local_env"]
                  regex         = "(.+)"
                  target_label  = "env"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_orbit_local_env", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  separator     = ";"
                  regex         = "(.+);(.+)"
                  replacement   = "$2"
                  target_label  = "component"
                }
              }
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }
              loki.write "default" {
                endpoint {
                  url = "http://loki.loki.svc:3100/loki/api/v1/push"
                }
              }
        controller:
          type: daemonset
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
