# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.

# The OTel Operator — SDK injection (OBSERVABILITY.md Phase 4). Its mutating webhook
# adds the language SDK to a pod at admission when the pod carries an inject
# annotation; the generator emits those annotations from the catalog's `language:`
# field, so connected traces are a catalog fact, not an app change. The webhook's
# certificate comes from cert-manager like every other webhook here — the chart's
# self-signed path is the same hook machinery that has already bitten this platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.122.0
    helm:
      valuesObject:
        manager:
          resources:
            # Measured 48h: peak 37Mi, p99 36Mi.
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          # No collector CRs are used here (traces go straight to Tempo); the
          # leader-election single replica default is right for one node.
        admissionWebhooks:
          certManager:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
