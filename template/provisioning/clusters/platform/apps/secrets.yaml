# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.
# The encrypted SopsSecrets for the sops secret plane (`secrets.provider: sops`).
# The sops operator decrypts them into Secrets; nothing committed here is plaintext.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: "{{git.repoUrl}}"
    targetRevision: main
    path: clusters/platform/secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
