# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.
apiVersion: v1
kind: Service
metadata:
  name: orbitd
  namespace: orbit
spec:
  selector: {app: orbitd}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Routed like every other service: Traefik terminates TLS with the wildcard cert; no
# tls block here (an Ingress can only name a Secret in its own namespace — the argocd
# ingress learned this the loud way). Hosts are orbit.<primary> and mcp.<primary>:
# phase 8 moved the mcp record the deleted agentgateway held onto orbitd, which is
# the MCP server now.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbitd
  namespace: orbit
spec:
  ingressClassName: traefik
  rules:
    - host: orbit.{{domains.primary}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbitd
                port: {name: http}
    - host: mcp.{{domains.primary}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbitd
                port: {name: http}
