# GENERATED into clusters/ by `make init` from instance/config.yaml.
# Do not edit the copy under clusters/ (a re-run overwrites it), nor this staged source:
# provisioning/ is vendored from orbit-core at the pin, and `make core-sync` replaces it.
# Change the text in orbit-core and bump the pin.
# The monitoring namespace. The secrets the stack needs come from SopsSecrets the
# desk applies (clusters/platform/secrets/monitoring/<name>.yaml), so no Secret
# producer lives in this file.
#
# The namespace lives in platform-config (wave 2) rather than beside the stack
# (wave 3) for a structural reason: Argo will not start a wave until the previous
# one is healthy, and Grafana cannot become healthy without its admin secret. A
# secret produced in a LATER wave than its consumer is a deadlock, not a race —
# the consumer never goes healthy, so the wave that would have unblocked it never
# runs.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Named by the generated default-deny NetworkPolicy in every service namespace, which
    # admits `monitoring` explicitly. Rename this namespace and every scrape target goes
    # dark with no error anywhere — Prometheus simply reports the target as down.
    kubernetes.io/metadata.name: monitoring
