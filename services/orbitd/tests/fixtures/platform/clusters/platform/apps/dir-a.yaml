apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dir-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/repo.git
    targetRevision: main
    path: clusters/platform/config
    directory:
      recurse: true
      exclude: 'skip/**'
  destination:
    server: https://kubernetes.default.svc
    namespace: proj-a
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
