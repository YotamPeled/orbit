apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: classes
  namespace: argocd
  annotations:
    orbit.local/generated-secrets: minted
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/repo.git
