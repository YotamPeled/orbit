[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitd"
version = "0.1.0"
description = "Orbit's control surface: an MCP server (2026-07-28, Streamable HTTP) with a co-hosted OAuth 2.1 authorization server."
requires-python = ">=3.12"
dependencies = [
    # Pinned to the release that implements MCP revision 2026-07-28 (see docs/ORBITD.md "Decisions").
    "mcp==2.2.0",
    "PyJWT==2.13.0",
    "cryptography>=45",
    "pydantic>=2.10",
    "starlette>=0.47",
    "uvicorn>=0.34",
    "httpx==0.28.1",
    "kubernetes==33.1.0",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4", "httpx2>=2.10"]

[project.scripts]
orbitd = "orbitd.cli:main"
orbit = "orbitd.client:main"

[tool.setuptools.packages.find]
include = ["orbitd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
